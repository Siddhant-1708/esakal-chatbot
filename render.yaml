services:
  - type: web
    name: esakal-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QUINTYPE_API_BASE
        sync: false
      - key: SAKAL_PLUS_SUBSCRIPTION_URL
        sync: false
      - key: SMARTFLOW_INDEX_URL
        sync: false
